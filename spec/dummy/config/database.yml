test:
  adapter: sqlite3
  # Pool checkouts share a file; parallel workers each need a separate file.
  database: db/test<%= "_#{ENV["POLYRUN_SHARD_INDEX"]}" if ENV["POLYRUN_SHARD_INDEX"] %>.sqlite3
  pool: 5
  # Milliseconds to wait on a locked database (Rails busy_handler_timeout).
  timeout: 5000
